<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Общая оболочка авторизации Bronly</title><style>
:root{--bg:#f4f0e9;--s:#fffdf9;--soft:#f8f4ed;--t:#172522;--m:#687470;--b:#ded8ce;--a:#176b62;--ap:#e4f0ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:linear-gradient(145deg,var(--ap),var(--bg) 45%,#faf6ef);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{display:grid;min-height:100svh;place-items:center;padding:32px 24px}.shell{display:grid;width:min(980px,100%);grid-template-columns:minmax(0,.9fr) minmax(360px,1.1fr);gap:40px;padding:40px;border:1px solid rgba(23,107,98,.16);border-radius:28px;background:rgba(255,253,249,.96);box-shadow:0 24px 70px rgba(23,37,34,.14)}.intro,.form{display:grid;align-content:start}.intro{gap:28px}.brand{font-size:21px;font-weight:900}.copy{display:grid;gap:14px;padding-top:18px}.eyebrow{width:max-content;padding:6px 11px;border-radius:999px;background:var(--ap);color:var(--a);font-size:12px;font-weight:800}.copy h1,.copy p{margin:0}.copy h1{max-width:10ch;font-size:50px;line-height:.98;letter-spacing:-.05em}.copy p{color:var(--m)}.guide{display:grid;gap:10px;padding-top:20px;border-top:1px solid var(--b)}.guide div{display:grid;grid-template-columns:9px 1fr;gap:11px;align-items:center;color:var(--m);font-size:13px}.guide i{width:9px;height:9px;border-radius:50%;background:var(--a)}.form{display:grid;gap:18px;padding:24px;border:1px solid var(--b);border-radius:22px;background:var(--s)}label{display:grid;gap:7px;font-size:13px;font-weight:800}input{width:100%;min-height:46px;border:1px solid var(--b);border-radius:13px;padding:0 13px}.button{display:grid;min-height:46px;place-items:center;border-radius:13px;background:var(--a);color:white;font-weight:800}.footer{text-align:center;color:var(--m);font-size:13px}@media(max-width:760px){main{display:block;padding:18px 14px}.shell{grid-template-columns:1fr;gap:20px;padding:20px}.copy{padding:0}.copy h1{font-size:clamp(34px,11vw,44px)}.guide{display:none}.form{padding:18px}}
</style></head><body><main><section class="shell"><div class="intro"><div class="brand">Bronly</div><div class="copy"><span class="eyebrow">ВХОД В BRONLY</span><h1>Вход в аккаунт</h1><p>Вернитесь в кабинет, чтобы управлять объектами, календарём занятости и заявками.</p></div><div class="guide"><div><i></i><span>Прямая публичная ссылка без общего каталога</span></div><div><i></i><span>Объекты, номера и занятость в одном кабинете</span></div><div><i></i><span>Заявки и статусы доступны в личном кабинете</span></div></div></div><div class="form"><label>Email<input value="name@example.com"></label><label>Пароль<input type="password" value="12345678"></label><span class="button">Войти</span><div class="footer">Нет аккаунта? Создать аккаунт</div></div></section></main></body></html>
