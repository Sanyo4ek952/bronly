<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D36 — Агентские заявки</title><style>
:root{--bg:#f4f0e9;--s:#fffdf9;--soft:#f8f4ed;--t:#172522;--m:#687470;--b:#ded8ce;--a:#176b62;--ap:#e4f0ed;--warn:#fff4d8}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{max-width:1080px;margin:auto;padding:28px clamp(16px,4vw,42px)}.page{display:grid;gap:20px}h1,h2,p{margin:0}h1{font-size:clamp(32px,5vw,46px);line-height:1.02}.muted{color:var(--m)}.notice,.panel{border:1px solid var(--b);border-radius:20px;background:var(--s)}.notice{padding:14px 16px;background:var(--warn)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}.stat{padding:15px 17px;border-right:1px solid var(--b)}.stat:last-child{border:0}.stat strong{display:block;font-size:24px}.panel{display:grid;gap:16px;padding:20px}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:14px;border-radius:17px;background:var(--soft)}.meta span{display:block;color:var(--m);font-size:11px}.button{display:grid;min-height:44px;place-items:center;border-radius:14px;background:var(--a);color:white;font-weight:800}@media(max-width:640px){.meta{grid-template-columns:1fr 1fr}.panel{padding:15px}}@media(max-width:360px){.meta{grid-template-columns:1fr}}
</style></head><body><main><div class="page"><header><h1>Агентские заявки</h1><p class="muted">Запросы по вашей публичной ссылке и подборкам.</p></header><div class="notice">Новая заявка скрыта от владельца до действия «Передать владельцу».</div><section class="panel stats"><div class="stat"><strong>7</strong><span>все</span></div><div class="stat"><strong>3</strong><span>новые</span></div><div class="stat"><strong>2</strong><span>переданы</span></div></section><article class="panel"><h2>Анна · новая заявка</h2><div class="meta"><div><span>Вариант</span><b>Дом у моря · Люкс</b></div><div><span>Даты</span><b>20–24 сентября</b></div><div><span>Гости</span><b>2 гостя</b></div><div><span>Цена агента</span><b>48 000 ₽</b></div></div><span class="button">Передать владельцу</span></article></div></main></body></html>
