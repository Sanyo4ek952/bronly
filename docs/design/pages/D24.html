<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D24 — Календарь агента</title><style>
:root{--bg:#f4f0e9;--s:#fffdf9;--soft:#f8f4ed;--t:#172522;--m:#687470;--b:#ded8ce;--a:#176b62;--ap:#e4f0ed;--busy:#f7e8c9}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:28px clamp(16px,4vw,42px) 48px}.page{display:grid;min-width:0;gap:20px}h1,h2,p{margin:0}h1{font-size:clamp(32px,5vw,46px);line-height:1.02;letter-spacing:-.045em}.muted{color:var(--m)}.notice,.panel{min-width:0;border:1px solid var(--b);border-radius:20px;background:var(--s)}.notice{padding:14px 16px;background:var(--ap)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}.stat{padding:15px 17px;border-right:1px solid var(--b)}.stat:last-child{border:0}.stat strong{display:block;font-size:24px}.stat span{color:var(--m);font-size:12px}.calendar{overflow:hidden}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;border-bottom:1px solid var(--b)}.buttons{display:flex;gap:8px}.button{display:grid;min-height:42px;place-items:center;border:1px solid var(--b);border-radius:14px;padding:0 14px;font-weight:800}.scroll{overflow-x:auto;padding:18px}.timeline{display:grid;min-width:820px;grid-template-columns:210px repeat(8,1fr);gap:8px}.day{text-align:center;color:var(--m);font-size:11px}.room,.cell{min-height:60px;border-radius:14px}.room{padding:10px;background:var(--ap);font-weight:800}.cell{background:var(--soft)}.cell.busy{background:var(--busy)}@media(max-width:600px){main{padding-top:20px}.stats .stat{padding:11px 8px}.cal-head{align-items:stretch;flex-direction:column}.buttons{width:100%}.button{flex:1}}
</style></head><body><main><div class="page"><header><h1>Календарь занятости</h1><p class="muted">Подключённые объекты и отдельные номера.</p></header><div class="notice">Только чтение: агент не меняет даты, цены, фото или данные владельца.</div><section class="panel stats"><div class="stat"><strong>4</strong><span>варианта</span></div><div class="stat"><strong>7</strong><span>номеров</span></div><div class="stat"><strong>12</strong><span>занятых диапазонов</span></div></section><section class="panel calendar"><div class="cal-head"><div><h2>Дом у моря</h2><p class="muted">16 сентября — 15 октября</p></div><div class="buttons"><span class="button">←</span><span class="button">Текущий месяц</span><span class="button">→</span></div></div><div class="scroll"><div class="timeline"><div></div><div class="day">16 ср</div><div class="day">17 чт</div><div class="day">18 пт</div><div class="day">19 сб</div><div class="day">20 вс</div><div class="day">21 пн</div><div class="day">22 вт</div><div class="day">23 ср</div><div class="room">Люкс с террасой</div><div class="cell"></div><div class="cell busy"></div><div class="cell busy"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell busy"></div><div class="cell"></div></div></div></section></div></main></body></html>
