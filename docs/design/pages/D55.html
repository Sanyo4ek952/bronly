<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D55 — Заявка владельцу</title><style>:root{--bg:#f4f0e9;--s:#fffdf9;--t:#172522;--b:#ded8ce;--a:#176b62;--p:#e4f0ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{max-width:920px;margin:auto;padding:24px clamp(14px,4vw,36px)}h1,p{margin:0}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:21px;font-weight:900}.close{font-weight:800}.frame{display:grid;grid-template-columns:.9fr 1.1fr;overflow:hidden;border:1px solid var(--b);border-radius:26px;background:var(--s)}.summary,.form{display:grid;align-content:start;gap:15px;padding:30px}.summary{background:var(--p)}.eyebrow{color:var(--a);font-size:12px;font-weight:900}h1{font-size:clamp(32px,5vw,48px);line-height:1}.card,.notice{display:grid;gap:6px;padding:15px;border-radius:17px;background:var(--s)}.notice{background:#f7f2e8}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-weight:800}input,select{width:100%;min-height:44px;border:1px solid var(--b);border-radius:12px;background:white;padding:10px 12px;font:inherit}.button{display:grid;min-height:46px;place-items:center;border-radius:14px;background:var(--a);color:white;font-weight:900}@media(max-width:700px){.frame{grid-template-columns:1fr}.summary,.form{padding:20px}.row{grid-template-columns:1fr}}</style></head><body><main><div class="top"><span class="brand">Bronly</span><span class="close">Вернуться к странице</span></div><section class="frame"><div class="summary"><span class="eyebrow">ЗАЯВКА ВЛАДЕЛЬЦУ</span><h1>Оставить заявку</h1><p>Заявка отправляется на конкретный номер по базовой цене владельца.</p><div class="card"><strong>Люкс с террасой</strong><span>Дом у моря · 2 гостя</span><strong>12 000 ₽ / ночь</strong></div><div class="notice">Владелец свяжется с вами и уточнит доступность.</div></div><form class="form"><label>Номер<select><option>Люкс с террасой</option></select></label><div class="row"><label>Заезд<input value="20 сентября"></label><label>Выезд<input value="24 сентября"></label></div><div class="row"><label>Имя<input placeholder="Ваше имя"></label><label>Телефон<input placeholder="+7 999 000-00-00"></label></div><span class="button">Отправить заявку</span></form></section></main></body></html>
