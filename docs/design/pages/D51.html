<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D51 — Восстановление доступа</title><style>:root{--bg:#f4f0e9;--s:#fffdf9;--t:#172522;--b:#ded8ce;--a:#176b62;--p:#e4f0ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.story{display:grid;align-content:center;gap:16px;padding:clamp(28px,7vw,96px);background:linear-gradient(145deg,#dcebe7,#f4f0e9)}.brand{font-size:24px;font-weight:900}.story h2{font-size:clamp(34px,5vw,62px);line-height:1;margin:0}.auth{display:grid;place-items:center;padding:28px}.card{display:grid;width:min(100%,480px);gap:18px;padding:clamp(22px,5vw,42px);border:1px solid var(--b);border-radius:26px;background:var(--s)}h1,p{margin:0}.eyebrow{color:var(--a);font-size:12px;font-weight:900}h1{font-size:clamp(32px,5vw,48px);line-height:1}label{display:grid;gap:7px;font-weight:800}input{min-height:46px;border:1px solid var(--b);border-radius:12px;padding:11px 13px;font:inherit}.button{display:grid;min-height:46px;place-items:center;border-radius:14px;background:var(--a);color:white;font-weight:900}.footer{text-align:center;color:#687470}.footer strong{color:var(--a)}@media(max-width:760px){main{grid-template-columns:1fr}.story{min-height:220px;padding:28px}.auth{padding:18px}.card{padding:22px}}</style></head><body><main><section class="story"><span class="brand">Bronly</span><h2>Вернитесь к своим объектам и заявкам</h2><p>Ссылка для смены пароля придёт на зарегистрированный email.</p></section><section class="auth"><div class="card"><span class="eyebrow">ВОССТАНОВЛЕНИЕ ДОСТУПА</span><h1>Сброс пароля</h1><p>Отправим ссылку для смены пароля на ваш email.</p><label>Email<input placeholder="name@example.com"></label><span class="button">Отправить ссылку</span><p class="footer">Вспомнили пароль? <strong>Вернуться ко входу</strong></p></div></section></main></body></html>
