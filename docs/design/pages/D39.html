<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D39 — Главная администратора</title><style>
:root{--bg:#f4f0e9;--s:#fffdf9;--soft:#f8f4ed;--t:#172522;--m:#687470;--b:#ded8ce;--a:#176b62;--ap:#e4f0ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{max-width:1120px;margin:auto;padding:26px clamp(14px,4vw,42px)}.page{display:grid;gap:20px}h1,h2,p{margin:0}h1{font-size:clamp(32px,5vw,46px);line-height:1.02}.muted{color:var(--m)}.group{display:grid;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{display:grid;gap:8px;padding:17px;border:1px solid var(--b);border-radius:19px;background:var(--s)}.card strong{font-size:28px}.card span,.card small{color:var(--m)}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.action{display:grid;gap:6px;padding:18px;border:1px solid var(--b);border-radius:19px;background:var(--ap)}@media(max-width:850px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.stats,.actions{grid-template-columns:1fr}.card{padding:14px}}
</style></head><body><main><div class="page"><header><h1>Администрирование</h1><p class="muted">Пользователи, подписки и внутренние проверки Bronly.</p></header><section class="group"><h2>Пользователи</h2><div class="stats"><article class="card"><span>Всего</span><strong>128</strong><small>активные профили</small></article><article class="card"><span>Владельцы</span><strong>82</strong></article><article class="card"><span>Агенты</span><strong>41</strong></article><article class="card"><span>Новые</span><strong>5</strong></article></div></section><section class="group"><h2>Подписки</h2><div class="stats"><article class="card"><span>Активные</span><strong>104</strong></article><article class="card"><span>Grace</span><strong>8</strong></article><article class="card"><span>Истекли</span><strong>16</strong></article><article class="card"><span>На проверке</span><strong>3</strong></article></div></section><section class="actions"><article class="action"><h2>Ручные подтверждения</h2><p class="muted">Проверьте бонусы и продления.</p></article><article class="action"><h2>Объекты</h2><p class="muted">Доступность публичных страниц.</p></article></section></div></main></body></html>
