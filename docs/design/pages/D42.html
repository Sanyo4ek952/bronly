<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D42 — Подписки</title><style>
:root{--bg:#f4f0e9;--s:#fffdf9;--soft:#f8f4ed;--t:#172522;--m:#687470;--b:#ded8ce;--a:#176b62;--ap:#e4f0ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{max-width:980px;margin:auto;padding:26px clamp(14px,4vw,42px)}.page{display:grid;gap:18px}h1,h2,p{margin:0}h1{font-size:clamp(32px,5vw,46px);line-height:1.02}.muted{color:var(--m)}.filters{display:flex;gap:8px;overflow:auto}.filter{padding:9px 13px;border:1px solid var(--b);border-radius:999px;white-space:nowrap}.filter.on{background:var(--ap);color:var(--a);font-weight:800}.card{display:grid;gap:15px;padding:18px;border:1px solid var(--b);border-radius:20px;background:var(--s)}.head{display:flex;justify-content:space-between;gap:12px}.pill{padding:5px 9px;border-radius:999px;background:#e7f3e9;color:#28713d;font-size:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{color:var(--m);font-size:11px}.field input,.field select{min-width:0;min-height:44px;border:1px solid var(--b);border-radius:12px;padding:0 11px;background:var(--s)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.button{display:grid;min-height:44px;place-items:center;border-radius:13px;background:var(--a);color:white;font-weight:800}.button.alt{border:1px solid var(--b);background:var(--s);color:var(--t)}@media(max-width:600px){.head,.fields,.actions{display:grid;grid-template-columns:1fr}.card{padding:15px}}
