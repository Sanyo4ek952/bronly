<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D57 — Регистрация</title><style>:root{--bg:#f4f0e9;--s:#fffdf9;--t:#172522;--b:#ded8ce;--a:#176b62;--p:#e4f0ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.story{display:grid;align-content:center;gap:16px;padding:clamp(28px,7vw,96px);background:linear-gradient(145deg,#dcebe7,#f4f0e9)}.brand{font-size:24px;font-weight:900}.story h2{font-size:clamp(34px,5vw,62px);line-height:1;margin:0}.auth{display:grid;place-items:center;padding:28px}.card{display:grid;width:min(100%,500px);gap:16px;padding:clamp(22px,4vw,38px);border:1px solid var(--b);border-radius:26px;background:var(--s)}h1,p{margin:0}.eyebrow{color:var(--a);font-size:12px;font-weight:900}h1{font-size:clamp(32px,5vw,46px);line-height:1}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:6px;font-weight:800}input,select{width:100%;min-height:44px;border:1px solid var(--b);border-radius:12px;padding:10px 12px;font:inherit}.terms{display:flex;gap:9px;padding:11px;border-radius:13px;background:var(--bg);font-size:13px}.terms input{width:18px;min-height:18px}.button{display:grid;min-height:46px;place-items:center;border-radius:14px;background:var(--a);color:white;font-weight:900}.footer{text-align:center;color:#687470}@media(max-width:760px){main{grid-template-columns:1fr}.story{min-height:220px;padding:28px}.auth{padding:18px}.card{padding:22px}.row{grid-template-columns:1fr}}</style></head><body><main><section class="story"><span class="brand">Bronly</span><h2>Создайте свою прямую витрину</h2><p>Для владельца или агента — с ролью, понятной с первого шага.</p></section><section class="auth"><div class="card"><span class="eyebrow">СТАРТ ДЛЯ ВЛАДЕЛЬЦА ИЛИ АГЕНТА</span><h1>Создайте аккаунт</h1><p>Добавьте данные и начните настройку кабинета.</p><form class="form"><div class="row"><label>Имя<input placeholder="Иван Иванов"></label><label>Роль<select><option>Владелец</option><option>Агент</option></select></label></div><label>Email<input placeholder="name@example.com"></label><div class="row"><label>Телефон<input placeholder="+7 900 123-45-67"></label><label>Пароль<input placeholder="Минимум 8 символов"></label></div><label class="terms"><input type="checkbox"><span>Я принимаю пользовательское соглашение и политику конфиденциальности</span></label><span class="button">Зарегистрироваться</span></form><p class="footer">Уже есть аккаунт? Войти</p></div></section></main></body></html>
