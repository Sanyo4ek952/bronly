<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D32 — Сделки агента</title><style>
:root{--bg:#f4f0e9;--s:#fffdf9;--soft:#f8f4ed;--t:#172522;--m:#687470;--b:#ded8ce;--a:#176b62;--ap:#e4f0ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--t);font:15px/1.5 Inter,Arial,sans-serif}main{max-width:900px;margin:auto;padding:28px clamp(16px,4vw,42px)}.page{display:grid;gap:20px}h1,p{margin:0}h1{font-size:clamp(32px,5vw,46px);line-height:1.02;letter-spacing:-.045em}.muted{color:var(--m)}.panel,.notice{border:1px solid var(--b);border-radius:20px;background:var(--s)}.panel{display:grid;gap:16px;padding:20px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:17px;border-radius:17px;background:var(--soft)}.stat strong{display:block;font-size:27px}.stat span{color:var(--m);font-size:12px}.notice{padding:15px;background:var(--ap)}.button{display:grid;width:max-content;min-height:44px;place-items:center;border:1px solid var(--b);border-radius:14px;padding:0 16px;font-weight:800}@media(max-width:520px){main{padding-top:20px}.stats{grid-template-columns:1fr}.panel{padding:15px}.button{width:100%}}
</style></head><body><main><div class="page"><header><h1>Сделки</h1><p class="muted">Завершение подтверждает владелец по принятой заявке.</p></header><section class="panel"><div class="stats"><div class="stat"><strong>8</strong><span>завершённые сделки</span></div><div class="stat"><strong>Владелец</strong><span>ставит статус completed</span></div></div><div class="notice">Bronly не рассчитывает и не выплачивает комиссию агента.</div><span class="button">Открыть заявки</span></section></div></main></body></html>
