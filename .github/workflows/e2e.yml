name: Staging E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright role scenarios
    if: vars.E2E_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_OWNER_PUBLIC_SLUG: ${{ vars.E2E_OWNER_PUBLIC_SLUG }}
      E2E_OWNER_ROOM_ID: ${{ vars.E2E_OWNER_ROOM_ID }}
      E2E_OWNER_PROFILE_QUERY: ${{ vars.E2E_OWNER_PROFILE_QUERY }}
      E2E_TEST_PROPERTY_QUERY: ${{ vars.E2E_TEST_PROPERTY_QUERY }}
      E2E_AGENT_PUBLIC_ID: ${{ vars.E2E_AGENT_PUBLIC_ID }}
      E2E_GUEST_CHECK_IN: ${{ vars.E2E_GUEST_CHECK_IN }}
      E2E_GUEST_CHECK_OUT: ${{ vars.E2E_GUEST_CHECK_OUT }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
      E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ALLOW_MUTATIONS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run role scenarios against staging
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
